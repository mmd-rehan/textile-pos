version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: textile_pos_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: textile_root_pwd
      MYSQL_DATABASE: textile_pos
      MYSQL_USER: textile_user
      MYSQL_PASSWORD: textile_user_pwd
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
