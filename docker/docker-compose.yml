services:
  db:
    image: mariadb:10.11
    container_name: textile_pos_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-textile_root_pwd}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-textile_pos}
      MYSQL_USER:          ${MYSQL_USER:-textile_user}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-textile_user_pwd}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mariadb-admin
        - ping
        - -h
        - localhost
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD:-textile_root_pwd}
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  mysql_data:
