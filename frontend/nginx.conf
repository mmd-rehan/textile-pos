# Nginx config for the built TextilePOS SPA.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted Vite build assets are safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, so new deployments are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # NOTE: the API is intentionally NOT proxied here. The browser calls the backend
    # directly using the absolute VITE_API_BASE_URL baked in at build time.
    #
    # To serve the API on the SAME origin instead (single-domain deployment), add:
    #
    #   location /api/ {
    #       proxy_pass http://backend:5001;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Real-IP $remote_addr;
    #   }
    #
    # and rebuild the frontend with a relative VITE_API_BASE_URL=/api/v1.
}
